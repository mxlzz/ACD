name: ACD E0038 pinned OIDN 2.5.0 versus 2.5.1 same PFM and flags

on:
  push:
    branches:
      - dev/acd-v2-oidn-detail-eval
    paths:
      - .github/workflows/acd-e0038-oidn-version-isolation.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  compare-standalone-builds:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit contracts and EXR/PFM reader
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pytest -q tests/test_oidn_versions_e0038.py tests/test_oidn_standalone_e0037.py
      - name: Recover original E0037 2.5.1 results and E0035 native compositor
        run: |
          mkdir -p /tmp/e0038/e37 /tmp/e0038/e35_52 /tmp/e0038/e35_53 /tmp/e0038/out
          gh run download 43490674444 -R mxlzz/ACD -n acd-e0037-standalone-oidn-pfm -D /tmp/e0038/e37
          gh run download 43480823352 -R mxlzz/ACD -n acd-e0035-blender-5.2.4 -D /tmp/e0038/e35_52
          gh run download 43480823352 -R mxlzz/ACD -n acd-e0035-blender-5.3.0 -D /tmp/e0038/e35_53
          test -f docs/experiments/E0037_RESULTS.json
          test -f docs/experiments/E0035_RESULTS.json
      - name: Obtain official OIDN 2.5.0 from same upstream and pin asset digest
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            https://github.com/RenderKit/oidn/releases/download/v2.5.0/oidn-2.5.0.x86_64.linux.tar.gz \
            -o /tmp/e0038/oidn250.tar.gz
          echo "254a8355856f8cd433edb7dd832b5fb02e7157d073f7d22e331ce06533fb491f  /tmp/e0038/oidn250.tar.gz" | sha256sum -c -
          mkdir -p /tmp/e0038/oidn250
          tar -xzf /tmp/e0038/oidn250.tar.gz -C /tmp/e0038/oidn250
          BIN="$(find /tmp/e0038/oidn250 -type f -name oidnDenoise | head -n 1)"
          test -n "$BIN" && test -x "$BIN"
          echo "OIDN250_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --list_devices
      - name: Compare versions on EXACT SAME PFM matrices
        run: |
          python -m scripts.analyze_oidn_version_isolation_e0038 \
            --oidn250 "$OIDN250_BIN" \
            --original37 /tmp/e0038/e37 \
            --archive37 docs/experiments/E0037_RESULTS.json \
            --source52 /tmp/e0038/e35_52 --source53 /tmp/e0038/e35_53 \
            --archive35 docs/experiments/E0035_RESULTS.json \
            --output /tmp/e0038/out
      - name: Version archive and interpretation in GitHub
        run: |
          cp /tmp/e0038/out/e0038_results.json docs/experiments/E0038_RESULTS.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/experiments/E0038_RESULTS.json").read_text())
          lines=[
            "# E0038 — OIDN 2.5.0 vs 2.5.1: mismas matrices PFM",
            "",
            "Blender 5.2.4/5.3.0 CMake version pins OIDN 2.5.0. Ambos binarios standalone oficiales usados con mismos PFM, flags, CPU 4 threads. Entradas verificadas frente a E0035/E0037. Sin nuevos renders.",
            "",
            "| Blender fuente | Variante | OIDN 2.5.0 vs 2.5.1 | OIDN 2.5.0 vs compositor Blender |",
            "|---|---|---:|---:|",
          ]
          for v in ("5.2.4","5.3.0"):
            for m in ("raw_aux","accurate_like"):
              r=d["versions"][v]["modes"][m]
              lines.append(f'| {v} | {m} | {r["oidn250_vs_251"]["rmse_linear"]:.9f} | {r["oidn250_vs_blender_compositor"]["rmse_linear"]:.9f} |')
          lines += ["",
            "La cercanía entre outputs no demuestra calidad superior. Si persisten diferencias con Blender con OIDN 2.5.0, revisar la identidad del socket de guía y la ruta de prefiltrado antes de atribuirlas al motor.",
            "Resultados numéricos, hashes y flags: [E0038_RESULTS.json](E0038_RESULTS.json)."
          ]
          Path("docs/experiments/E0038.md").write_text("\n".join(lines)+"\n")
          trace="\n## E0038 — comparación OIDN 2.5.0/2.5.1 sobre los mismos PFM\n\n"+"\n".join(lines[2:])+"\n"
          for p in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
            with Path(p).open("a",encoding="utf-8") as f:f.write(trace)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/E0038.md docs/experiments/E0038_RESULTS.json
          git add STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "research(E0038): isolate OIDN 2.5.0/2.5.1 on identical EXR-derived PFM"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: Store temporary PFM outputs for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0038-oidn250-pfm
          retention-days: 14
          if-no-files-found: warn
          path: /tmp/e0038/out/
