name: ACD E0059 Cozy holdout-reference edge errors on frozen E0054 source

on:
  push:
    branches: [dev/acd-v2-oidn-detail-eval]
    paths:
      - .github/workflows/acd-e0059-cozy-crossref.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  analyze-without-rerender:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test crossfit strict reference isolation
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pytest -q tests/test_cozy_crossfit_e0059.py tests/test_cozy_hires_e0054.py
      - name: Recover original E0054 EXRs by published experiment run ID before expiry
        run: |
          mkdir -p /tmp/e0059-source
          gh run download 43930780340 -R mxlzz/ACD -n acd-e0054-hires-exr -D /tmp/e0059-source
          test -f /tmp/e0059-source/metadata.json
          test -f /tmp/e0059-source/reference.exr
          test -f /tmp/e0059-source/reference_check.exr
          test -f /tmp/e0059-source/seed_911/acd_compare_Raw.exr
          test -f /tmp/e0059-source/seed_1337/acd_compare_NATIVE_COMP_OIDN.exr
      - name: Cross-select reference-defined edges, score on independent finite reference
        run: |
          python -m scripts.analyze_cozy_crossfit_e0059 --directory /tmp/e0059-source --source-manifest docs/experiments/E0054_RESULTS.json --output /tmp/e0059-output
      - name: Preserve numeric result and decision in repository, no EXR re-upload
        run: |
          cp /tmp/e0059-output/E0059_RESULTS.json docs/experiments/E0059_RESULTS.json
          cp /tmp/e0059-output/E0059.md docs/experiments/E0059.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("docs/experiments/E0059_RESULTS.json").read_text())
          note=("E0059 cross-reference scored Cozy E0054 frozen EXRs, "
                "OIDN gradient regression in both ref directions and all 3 seeds? "
                +str(r["global_oidn_gradient_regression_screen"])
                +". No new renderer/denoiser, finite references uncertain. "
                 "docs/experiments/E0059.md.")
          for path in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
              with Path(path).open("a",encoding="utf-8") as f:
                  f.write("\n## E0059 cross-reference reference-selection isolation\n\n"+note+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/E0059.md docs/experiments/E0059_RESULTS.json
          git add STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "research(E0059): archive cross-reference heldout edge scores on original EXRs"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: Artifacts contain report only; source EXRs remain temporary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0059-reference-crossfit-report
          retention-days: 14
          if-no-files-found: warn
          path: /tmp/e0059-output/
