name: ACD E0024 HDR tail attribution from existing night EXR

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze-saved-exr:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EXR and test mask invariance
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pytest -q tests/test_hdr_tail.py
      - name: Retrieve original E0023 renders; NO rerender
        run: |
          mkdir -p /tmp/acd_e0024
          gh run download 43291659387 -R mxlzz/ACD -n acd-e0023-terraced-exr -D /tmp/acd_e0024
          gh run download 43291659387 -R mxlzz/ACD -n acd-e0023-terraced-metrics -D /tmp/acd_e0024
          test -f /tmp/acd_e0024/seed_1337/acd_compare_NATIVE_COMP_OIDN.exr
          test -f /tmp/acd_e0024/reference_check.exr
      - name: Compare the SAME highlight/raw-error masks in ALL candidates, both refs
        run: |
          python -m scripts.analyze_hdr_tail_e0024 --directory /tmp/acd_e0024 \
            --output /tmp/acd_e0024/e0024_hdr_tail.json
      - name: Archive numeric result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0024-hdr-tail-report
          retention-days: 14
          if-no-files-found: warn
          path: /tmp/acd_e0024/e0024_hdr_tail.json
