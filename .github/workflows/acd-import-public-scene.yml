name: ACD verify vendored official compact Cycles reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check pinned public binary and license metadata
        run: |
          python -m pytest -q tests/test_public_reference_fixture.py
          echo "5f27c41cf828ca15ffd06fc3ad3d971343f6af4a29828c834252229a26dce395  benchmarks/scenes/cozy_kitchen.blend" | sha256sum -c -
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-5.0.1-linux-x64
          key: official-blender-5.0.1-linux-x64-v2
      - if: steps.blender-cache.outputs.cache-hit != 'true'
        name: Download official Blender 5.0.1
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
      - name: Cycles smoke verification with disabled auto-execution
        run: |
          ./blender-5.0.1-linux-x64/blender --factory-startup --disable-autoexec \
            -b benchmarks/scenes/cozy_kitchen.blend --python-exit-code 1 \
            --python scripts/audit_public_scene.py
      - name: Archive functional audit and low-spp smoke only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acd-cozy-kitchen-verification
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/acd_public_scene_audit.json
            /tmp/acd_public_scene_smoke.png
