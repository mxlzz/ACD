name: ACD E0050 replay OIDN compositor with identical Raw and alternate cached guides

on:
  push:
    branches:
      - dev/acd-v2-oidn-detail-eval
    paths:
      - .github/workflows/acd-e0050-offline-guides.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  offline-guide-replay:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      ACD_E0050_ORIGINAL: /tmp/e0050-old
      ACD_E0050_ALT: /tmp/e0050-alt
      ACD_E0050_OUTPUT: /tmp/e0050-comp
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis library and test strict equivalence gates
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pip install "Pillow>=10,<13"
          python -m pytest -q tests/test_replayed_guides_e0050.py tests/test_weighting_e0049.py
      - name: Recover original E0046 and E0049 EXRs by published run ID
        run: |
          mkdir -p /tmp/e0050-extract-old /tmp/e0050-extract-alt /tmp/e0050-old /tmp/e0050-alt
          gh run download 43883209135 -R mxlzz/ACD -n acd-e0046-hires-density-crop-exr -D /tmp/e0050-extract-old
          gh run download 43894800865 -R mxlzz/ACD -n acd-e0049-native-roughnesss-exr -D /tmp/e0050-extract-alt
          for name in metadata.json raw_multilayer.exr acd_compare_Raw.exr acd_compare_NATIVE_COMP_OIDN.exr reference.exr reference_check.exr; do
            count="$(find /tmp/e0050-extract-old -type f -name "$name" | wc -l)"
            test "$count" -eq 1 || { echo "Missing/duplicate old $name"; exit 1; }
            find /tmp/e0050-extract-old -type f -name "$name" -exec cp -- '{}' /tmp/e0050-old/ ';'
          done
          for name in metadata.json raw_multilayer.exr acd_compare_Raw.exr acd_compare_NATIVE_COMP_OIDN.exr; do
            count="$(find /tmp/e0050-extract-alt -type f -name "$name" | wc -l)"
            test "$count" -eq 1 || { echo "Missing/duplicate alternative $name"; exit 1; }
            find /tmp/e0050-extract-alt -type f -name "$name" -exec cp -- '{}' /tmp/e0050-alt/ ';'
          done
      - uses: actions/cache@v4
        id: cache
        with:
          path: blender-5.2.4-linux-x64
          key: acd-verified-blender-5.2.4-linux-x64-a1
      - name: Fetch checksum-verified Blender if cache absent
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          F=blender-5.2.4-linux-x64.tar.xz
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 https://download.blender.org/release/Blender5.2/$F -o "$F"
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 https://download.blender.org/release/Blender5.2/blender-5.2.4.sha256 -o official.sha256
          grep -F "$F" official.sha256 | sha256sum -c -
          tar -xf "$F"
      - name: Ensure headless compositor libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 libxkbcommon0
      - name: Replay original RGB with both EXR AOV sets through same compositor graph
        run: |
          ./blender-5.2.4-linux-x64/blender -b --factory-startup --python-exit-code 1 --python scripts/blender_replay_guides_e0050.py
      - name: Compare against original native OIDN and both fixed references
        run: |
          python -m scripts.analyze_replayed_guides_e0050 --old /tmp/e0050-old --alternative /tmp/e0050-alt --comparison /tmp/e0050-comp --result46 docs/experiments/E0046_RESULTS.json --result49 docs/experiments/E0049_RESULTS.json --output /tmp/e0050-results
      - name: Archive output and proper stop or attribution decision
        run: |
          mkdir -p docs/experiments benchmarks/results/detail_replay_e0050
          cp /tmp/e0050-results/E0050_RESULTS.json docs/experiments/E0050_RESULTS.json
          cp /tmp/e0050-results/E0050_replayed_guides.png benchmarks/results/detail_replay_e0050/
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/experiments/E0050_RESULTS.json").read_text())
          m=d["metrics"]
          lines=[
            "# E0050 — Offline Blender OIDN replay with frozen same Raw and two guide sets",
            "", "[Prior protocol](E0050_PLAN.md). Source E0046/E0049 EXR/AOV, same input image; original Blender addon untouched. No new architectural reference renders.",
            "",
            "![Original guides and alternative native roughness guides on same RGB](../../benchmarks/results/detail_replay_e0050/E0050_replayed_guides.png)",
            "",
            "Raw passthrough maximum delta: "+str(m["raw_passthrough_max_abs"])+". Verified="+str(m["raw_passthrough_verified"])+".",
            "Baseline OIDN native vs replay maximum delta: "+str(m["baseline_native_replay_max_abs"])+". Verified="+str(m["native_replay_verified"])+".",
            "Decision: "+m["decision"],
            "Difference between replayed OIDN outputs RMSE: "+str(m["replay_vs_swap_rmse"]["rmse_linear"])+". This does not imply a quality winner."
          ]
          if m["native_replay_verified"] and m["raw_passthrough_verified"]:
            lines += ["","| ROI | Guide set | RMSE ref1 | RMSE ref2 | Edge contrast ref1 |",
                      "|---|---|---:|---:|---:|"]
            for roi in ("glass_overlap","uncovered_slats","interior"):
              for label in ("native_guides","alternative_guides"):
                r=m["scores"][label][roi]
                lines.append(f'| {roi} | {label} | {r["ref1"]["linear"]["rmse_linear"]:.7f} | {r["ref2"]["linear"]["rmse_linear"]:.7f} | {r["ref1"]["detail"]["edge_contrast_ratio"]:.4f} |')
          lines+=["","Two 512spp refs nonconverged. Only internal guide policy intervention is tested; no novel ACD denoiser.","[Full JSON](E0050_RESULTS.json)."]
          Path("docs/experiments/E0050.md").write_text("\n".join(lines)+"\n")
          note="\n## E0050 frozen Raw offline OIDN replay (2026-11-16)\n\n"+m["decision"]+"; native replay verified="+str(m["native_replay_verified"])+". No new denoiser/merge. See docs/experiments/E0050_RESULTS.json.\n"
          for path in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
            with Path(path).open("a",encoding="utf-8") as f:f.write(note)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/E0050.md docs/experiments/E0050_RESULTS.json
          git add benchmarks/results/detail_replay_e0050/ STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "research(E0050): archive same-Raw compositor replay with stop-if-not-equivalent gate"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: Temporary outputs for debugging no original scenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0050-replayed-guides-exr
          retention-days: 14
          if-no-files-found: warn
          path: /tmp/e0050-comp/
