name: ACD E0056 Classroom CC0 seed anomaly Blender 5.2.4

on:
  push:
    branches: [dev/acd-v2-oidn-detail-eval]
    paths:
      - .github/workflows/acd-e0056-classroom-seeds.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scene-rehabilitation-check:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      OMP_NUM_THREADS: "4"
      ACD_PROBE_SCENE: external
      ACD_PROBE_DIR: /tmp/e0056-seeds
      ACD_PROBE_OFFSET: "0"
      ACD_PROBE_PATTERN: TABULATED_SOBOL
      ACD_AUDIT_SOURCE: "Official Blender Classroom / Christophe Seux / CC0"
      ACD_AUDIT_RENDER: /tmp/e0056-smoke.png
      ACD_AUDIT_OUTPUT: /tmp/e0056-audit.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test E0056 numerical and existing seed audit contracts
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pytest -q tests/test_classroom_seed_e0056.py tests/test_seed_audit.py
      - name: Fetch hash-pinned official Classroom CC0 ZIP
        run: |
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            https://mirror.blender.org/demo/test/classroom.zip -o /tmp/classroom.zip
          echo "0f0ecc58d45f12b2f4272a53e2d8e69135518e16e956b118f10c20d8dcfdf5e6  /tmp/classroom.zip" | sha256sum -c -
          test "$(stat -c%s /tmp/classroom.zip)" -eq 70279690
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root=Path("/tmp/e0056-source")
          root.mkdir(parents=True,exist_ok=True)
          with ZipFile("/tmp/classroom.zip") as z:
              for item in z.infolist():
                  p=Path(item.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise RuntimeError("Unsafe ZIP member path")
              z.extractall(root)
          files=list(root.rglob("classroom.blend"))
          if len(files)!=1:raise RuntimeError("Missing or duplicate Classroom BLEND")
          with Path("/tmp/e0056-source-path").open("w") as f:f.write(str(files[0]))
          print("E0056_SOURCE",files[0])
          PY
      - uses: actions/cache@v4
        id: blender
        with:
          path: blender-5.2.4-linux-x64
          key: acd-verified-blender-5.2.4-linux-x64-a1
      - name: Download official SHA-verified Blender if cache absent
        if: steps.blender.outputs.cache-hit != 'true'
        run: |
          B=blender-5.2.4-linux-x64.tar.xz
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 https://download.blender.org/release/Blender5.2/$B -o "$B"
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 https://download.blender.org/release/Blender5.2/blender-5.2.4.sha256 -o official.sha256
          grep -F "$B" official.sha256 | sha256sum -c -
          tar -xf "$B"
      - name: Install headless Blender EGL runtime
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 libxkbcommon0
      - name: Check that source textures, linked libraries and IES exist
        run: |
          SOURCE="$(cat /tmp/e0056-source-path)"
          ./blender-5.2.4-linux-x64/blender --disable-autoexec -b "$SOURCE" --python-exit-code 1 --python scripts/audit_public_scene.py
      - name: Separate Cycles process, 16spp TABULATED_SOBOL seed 539
        env:
          ACD_PROBE_SEED: "539"
          ACD_PROBE_LABEL: seed539_offset0
        run: |
          SOURCE="$(cat /tmp/e0056-source-path)"
          ./blender-5.2.4-linux-x64/blender --disable-autoexec -b "$SOURCE" --python-exit-code 1 --python tests/blender_seed_probe.py
      - name: Separate Cycles process, same configuration seed 911
        env:
          ACD_PROBE_SEED: "911"
          ACD_PROBE_LABEL: seed911_offset0
        run: |
          SOURCE="$(cat /tmp/e0056-source-path)"
          ./blender-5.2.4-linux-x64/blender --disable-autoexec -b "$SOURCE" --python-exit-code 1 --python tests/blender_seed_probe.py
      - name: Score original identical-config seed comparison
        run: |
          python -m scripts.analyze_classroom_seed_e0056 \
            --directory /tmp/e0056-seeds --source-zip /tmp/classroom.zip --output /tmp/e0056-results
      - name: Preserve even a negative result, without source or EXR files in Git
        run: |
          cp /tmp/e0056-results/E0056.md docs/experiments/E0056.md
          cp /tmp/e0056-results/E0056_RESULTS.json docs/experiments/E0056_RESULTS.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("docs/experiments/E0056_RESULTS.json").read_text())
          test=data["test"]
          msg=("E0056 Classroom CC0 old E0007 seed anomaly on Blender5.2.4, separate Cycles 96x54/16spp processes "
               "539/911 TABULATED_SOBOL, RMSE="+str(test["rmse"])+", relative="+str(test["relative_rmse"])
               +", measurable="+str(test["measurably_distinct"])+". No reference or denoiser; not proof of independence. "
               "docs/experiments/E0056.md.")
          for p in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
              with Path(p).open("a",encoding="utf-8") as f:
                  f.write("\n## E0056 Classroom seed diagnosis\n\n"+msg+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/E0056.md docs/experiments/E0056_RESULTS.json
          git add STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "research(E0056): archive Classroom 5.2.4 E0007 seed control"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: Ephemeral source audit and EXR seed probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0056-classroom-raw-seeds
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/e0056-audit.json
            /tmp/e0056-smoke.png
            /tmp/e0056-seeds/
