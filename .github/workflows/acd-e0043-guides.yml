name: ACD E0043 targeted OIDN guidance failure screen (one render, existing refs)

on:
  push:
    branches:
      - dev/acd-v2-oidn-detail-eval
    paths:
      - .github/workflows/acd-e0043-guides.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  one-guidance-diagnosis:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ github.token }}
      ACD_E0043_ROOT: /tmp/acd-e0043
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test scientific guards without rendering
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pip install "Pillow>=10,<13"
          python -m pytest -q tests/test_guides_e0043.py tests/test_italian_ladder_e0042.py
      - name: Retrieve exact existing E0042 references (no duplicate reference rendering)
        run: |
          mkdir -p /tmp/acd-e0043-reference
          gh run download 43497486691 -R mxlzz/ACD -n acd-e0042-italian-640-exr -D /tmp/acd-e0043-reference
          test -f docs/experiments/E0042_RESULTS.json
      - name: Fetch hash-pinned original architectural scene
        run: |
          mkdir -p /tmp/acd-e0043-source
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            https://download.blender.org/demo/cycles/flat-archiviz.blend -o /tmp/acd-e0043-source/flat-archiviz.blend
          echo "0027fcbd73411cce7f49b3d86c22c03d18980e22641083da9d8ba82d9fc94e25  /tmp/acd-e0043-source/flat-archiviz.blend" | sha256sum -c -
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-5.2.4-linux-x64
          key: acd-verified-blender-5.2.4-linux-x64-a1
      - name: Download official SHA-verified Blender on cache miss
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          F=blender-5.2.4-linux-x64.tar.xz
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 \
            https://download.blender.org/release/Blender5.2/$F -o "$F"
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 \
            https://download.blender.org/release/Blender5.2/blender-5.2.4.sha256 -o official.sha256
          grep -F "$F" official.sha256 | sha256sum -c -
          tar -xf "$F"
      - name: Headless EGL libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1-mesa-dri libopengl0 libxkbcommon0
      - name: One 32spp Cycles render, built-in OIDN three guide modes
        run: |
          ./blender-5.2.4-linux-x64/blender --factory-startup --disable-autoexec \
            -b /tmp/acd-e0043-source/flat-archiviz.blend --python-exit-code 1 \
            --python scripts/blender_guides_e0043.py
      - name: Verify hashes and compare against two archived finite references
        run: |
          python -m scripts.analyze_guides_e0043 \
            --source /tmp/acd-e0043 --refs /tmp/acd-e0043-reference \
            --manifest42 docs/experiments/E0042_RESULTS.json --output /tmp/acd-e0043-report
      - name: Publish traceable data and image with no fabricated quality claim
        run: |
          mkdir -p benchmarks/results/italian_flat_e0043 docs/experiments
          cp /tmp/acd-e0043-report/e0043_guides_1to1.png benchmarks/results/italian_flat_e0043/
          cp /tmp/acd-e0043-report/e0043_results.json docs/experiments/E0043_RESULTS.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("docs/experiments/E0043_RESULTS.json").read_text())
          lines=[
            "# E0043 — OIDN guides diagnostic, Italian Flat",
            "",
            "Original scene © Flavio Della Tommasa, Blender CC-BY. Blender 5.2.4, 640x400, Cycles CPU single noisy render 32spp seed539.",
            "Three *existing* OIDN compositor guide configurations; all Accurate, High, HDR. No original algorithm, no training.",
            "",
            "![Same-seed Raw and OIDN with 0/1/2 guides, plus the two finite references](italian_guides.png)",
            "",
            "| Candidate | RMSE vs 128spp ref8819 | RMSE vs 128spp ref8922 |",
            "|---|---:|---:|"
          ]
          for name in ("Raw","OIDN_RGB","OIDN_Albedo","OIDN_Both"):
              a=r["global_errors"][name]
              lines.append(f'| {name} | {a["ref8819"]["rmse_linear"]:.7f} | {a["ref8922"]["rmse_linear"]:.7f} |')
          lines += ["",
            "128spp reference disagreement RMSE: "+str(r["reference_pair_disagreement"]["rmse_linear"])+".",
            "Pre-registered 4x4 reference-screen flags: "+str(r["tentative_guide_regression_tiles"])+". A flag is NOT a verified visually meaningful problem.",
            "These references are unconverged; comparing filters to them does not establish which one is better. Inspect selected tiles visually before causal inference.",
            "[Complete numeric report](../../../docs/experiments/E0043_RESULTS.json)."
          ]
          Path("benchmarks/results/italian_flat_e0043/README.md").write_text("\n".join(lines)+"\n")
          docs="\n".join(lines).replace("](italian_guides.png","](../../benchmarks/results/italian_flat_e0043/italian_guides.png")
          Path("docs/experiments/E0043.md").write_text(docs+"\n")
          from shutil import copyfile
          copyfile("benchmarks/results/italian_flat_e0043/e0043_guides_1to1.png",
                   "benchmarks/results/italian_flat_e0043/italian_guides.png")
          Path("benchmarks/results/italian_flat_e0043/e0043_guides_1to1.png").unlink()
          note=("\n## E0043 guide-screen diagnostic (not new algorithm)\n\n"
                +"Compared same 32spp Raw across native OIDN three builtin guide settings; two nonconverged 128spp refs. "
                +"Full results docs/experiments/E0043_RESULTS.json; image benchmarks/results/italian_flat_e0043/README.md. "
                +"No promotion. Screen flags "+str(r["tentative_guide_regression_tiles"])+
                ". Do NOT optimize guide weights based on observed scene.\n")
          for path in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
              with Path(path).open("a",encoding="utf-8") as f:f.write(note)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/E0043_RESULTS.json docs/experiments/E0043.md
          git add benchmarks/results/italian_flat_e0043/ STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "research(E0043): locate guide-dependent OIDN failures on single noisy Italian Flat render"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: Retain EXR briefly as diagnostic, never input BLEND
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0043-one-render-guide-outputs
          retention-days: 14
          if-no-files-found: warn
          compression-level: 1
          path: /tmp/acd-e0043/
