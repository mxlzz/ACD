name: ACD E0029 third-scene emission validation
on:
  push:
    branches: [dev/acd-v2-oidn-detail-eval]
    paths: [.github/workflows/acd-e0029-island-quality.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  island:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      BENCH: /tmp/acd-e0029-island
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup and assert frozen input
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pytest -q tests/test_emission_guide.py tests/test_highlight_blend.py tests/test_detail.py
          test "$(git hash-object benchmarks/scenes/low_poly_island.blend)" = e540ffeae1f063393d644bd4af3a0a27f732fe5c
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-5.0.1-linux-x64
          key: official-blender-5.0.1-linux-x64-v2
      - if: steps.blender-cache.outputs.cache-hit != 'true'
        name: Download Blender 5.0.1
        run: |
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
      - name: Render and compare same-seed native and ACD
        run: |
          python scripts/run_scene_benchmark.py \
            --blender "$PWD/blender-5.0.1-linux-x64/blender" \
            --blend benchmarks/scenes/low_poly_island.blend \
            --output "$BENCH" --max-width 320 \
            --samples 24 --reference-samples 512 \
            --seed 539 --extra-seeds 911,1337 --reference-seed 8819 \
            --second-reference --device CPU \
            --methods STANDARD,HIGH,SUPER,NATIVE_COMP_OIDN
      - name: Frozen E0027 emission guided variants and controls
        run: |
          python -m scripts.analyze_island_e0029 \
            --directory "$BENCH" --output "$BENCH/e0029_quality.json"
      - name: Archive exact EXR and comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0029-island-quality
          retention-days: 14
          if-no-files-found: warn
          compression-level: 4
          path: /tmp/acd-e0029-island/
