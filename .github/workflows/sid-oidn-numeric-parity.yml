name: ACD M3.7 isolated OIDN cross Blender Fast Accurate Alpha Emission

on:
  pull_request:
    paths:
      - ".github/workflows/sid-oidn-numeric-parity.yml"
      - "tests/blender_sid_oidn_numeric.py"
      - "scripts/compare_sid_oidn_numeric.py"
      - "scripts/sid_highsuper_numeric_fixture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-oidn:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACD_OIDN_INPUT: /tmp/acd_sid_oidn/input
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EXR and prepare identical fixture
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m scripts.sid_highsuper_numeric_fixture --output "$ACD_OIDN_INPUT"
      - uses: actions/cache@v4
        id: old-cache
        with:
          path: blender-3.6.23-linux-x64
          key: official-blender-3.6.23-linux-x64-v1
      - if: steps.old-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --connect-timeout 30 https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz -o old.tar.xz
          tar -xf old.tar.xz
      - name: Isolate Blender 3.6 OIDN nodes
        env:
          ACD_OIDN_FLAVOR: legacy
          ACD_OIDN_OUTPUT: /tmp/acd_sid_oidn/legacy
        run: ./blender-3.6.23-linux-x64/blender -b --factory-startup -noaudio --python-exit-code 1 --python tests/blender_sid_oidn_numeric.py
      - uses: actions/cache@v4
        id: new-cache
        with:
          path: blender-5.0.1-linux-x64
          key: official-blender-5.0.1-linux-x64-v2
      - if: steps.new-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --connect-timeout 30 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o new.tar.xz
          tar -xf new.tar.xz
      - name: Isolate Blender 5 OIDN nodes
        env:
          ACD_OIDN_FLAVOR: port
          ACD_OIDN_OUTPUT: /tmp/acd_sid_oidn/port
        run: ./blender-5.0.1-linux-x64/blender -b --factory-startup -noaudio --python-exit-code 1 --python tests/blender_sid_oidn_numeric.py
      - name: Analyze OIDN family differences by input and prefilter
        run: python -m scripts.compare_sid_oidn_numeric --input "$ACD_OIDN_INPUT" --legacy /tmp/acd_sid_oidn/legacy --port /tmp/acd_sid_oidn/port --output /tmp/acd_sid_oidn/report
      - name: Archive same EXRs and isolated OIDN differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-7-oidn-isolated-fast-accurate-emission-alpha
          if-no-files-found: warn
          retention-days: 14
          path: /tmp/acd_sid_oidn/
