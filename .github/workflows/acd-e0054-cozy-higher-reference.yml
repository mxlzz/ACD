name: ACD E0054 Cozy real 1920px-density detail 24spp 3 seeds 512spp refs

on:
  push:
    branches: [dev/acd-v2-oidn-detail-eval]
    paths:
      - .github/workflows/acd-e0054-cozy-higher-reference.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-higher-reference:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      ACD_SCENE: external
      ACD_E0053_CROP: cozy_detail_2
      ACD_DEVICE: CPU
      ACD_BENCH_DIR: /tmp/e0054
      ACD_WIDTH: "1920"
      ACD_HEIGHT: "1808"
      ACD_INPUT_SPP: "24"
      ACD_INPUT_SEED: "539"
      ACD_REFERENCE_SPP: "512"
      ACD_REFERENCE_SEED: "8819"
      ACD_DOUBLE_REFERENCE: "1"
      ACD_EXTRA_SEEDS: "911,1337"
      ACD_METHODS: STANDARD,NATIVE_COMP_OIDN
      ACD_CAPTURE_AOV: "1"
      ACD_E0044_ADAPTIVE_OFF: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scientific dependencies and strict input-contract tests
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pip install "Pillow>=10,<13"
          python -m pytest -q tests/test_cozy_hires_e0054.py tests/test_cozy_crop_e0053.py tests/test_cozy_consensus_e0052.py
          echo "5f27c41cf828ca15ffd06fc3ad3d971343f6af4a29828c834252229a26dce395  benchmarks/scenes/cozy_kitchen.blend" | sha256sum -c -
      - uses: actions/cache@v4
        id: blender
        with:
          path: blender-5.2.4-linux-x64
          key: acd-verified-blender-5.2.4-linux-x64-a1
      - name: Fetch checksum-verified Blender when uncached
        if: steps.blender.outputs.cache-hit != 'true'
        run: |
          B=blender-5.2.4-linux-x64.tar.xz
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 https://download.blender.org/release/Blender5.2/$B -o "$B"
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 https://download.blender.org/release/Blender5.2/blender-5.2.4.sha256 -o official.sha256
          grep -F "$B" official.sha256 | sha256sum -c -
          tar -xf "$B"
      - name: Headless Blender EGL dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 libxkbcommon0
      - name: Three 24spp noisy seeds and two 512spp references in same scene
        run: |
          mkdir -p /tmp/e0054
          start=$(date +%s)
          ./blender-5.2.4-linux-x64/blender -b --disable-autoexec benchmarks/scenes/cozy_kitchen.blend --python-exit-code 1 --python tests/blender_compare_smoke.py
          echo "$(( $(date +%s) - start ))" > /tmp/e0054/wall_seconds.txt
      - name: Validate exact AOV/Raw and compare finite references
        run: |
          python -m scripts.analyze_cozy_hires_e0054 --directory /tmp/e0054 --output /tmp/e0054-report
      - name: Persist results and reference-only diagnostic image
        run: |
          mkdir -p benchmarks/results/cozy_e0054
          cp /tmp/e0054-report/E0054.md docs/experiments/E0054.md
          cp /tmp/e0054-report/E0054_RESULTS.json docs/experiments/E0054_RESULTS.json
          cp /tmp/e0054-report/E0054_1to1.png benchmarks/results/cozy_e0054/
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("docs/experiments/E0054_RESULTS.json").read_text())
          c=r["center"]
          note=f"E0054 Cozy 512px render crop at virtual1920, 24spp x3, refs512spp x2, wall={r['elapsed_wall_seconds']}s, reference_ref_rmse={r['reference_pair_rmse_in_center']:.6f}, OIDN_rmse={r['mean_native_rmse_to_two_refs_in_center']:.6f}, ref_disagreement/oidn={r['reference_disagreement_relative_to_native_rmse']:.3f}, edge_screen={c['persistent_attenuation_screen']}. No new algorithm or perceptual validation. docs/experiments/E0054.md."
          for path in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
              with Path(path).open("a",encoding="utf-8") as f:
                  f.write("\n## E0054 Cozy high-density reference result\n\n"+note+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/E0054.md docs/experiments/E0054_RESULTS.json
          git add benchmarks/results/cozy_e0054/ STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "research(E0054): archive native OIDN real-pixel Cozy crops and 512spp refs"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: Temporary original EXR artifacts, do not publish source copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0054-hires-exr
          retention-days: 7
          if-no-files-found: warn
          compression-level: 1
          path: /tmp/e0054/
