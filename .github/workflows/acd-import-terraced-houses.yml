name: ACD import public MIT held-out night exterior

on:
  push:
    branches:
      - dev/acd-v2-oidn-detail-eval
    paths:
      - .github/workflows/acd-import-terraced-houses.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish-exterior:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ACD_AUDIT_SOURCE: 'Yunus Emre Karaman Terraced Houses, MIT, commit 36c46d3b49ea872f6039e07a5e4769b5f9443654'
      ACD_AUDIT_RENDER: /tmp/acd_terraced_smoke.png
      ACD_AUDIT_OUTPUT: /tmp/acd_terraced_audit.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and pin authored MIT source from immutable upstream commit
        run: |
          mkdir -p benchmarks/scenes
          curl -fL --retry 3 --connect-timeout 30 \
            https://raw.githubusercontent.com/emrelab/blender-projects/36c46d3b49ea872f6039e07a5e4769b5f9443654/terraced-houses/terraced-house.blend \
            -o benchmarks/scenes/terraced_houses.blend
          test "$(stat -c%s benchmarks/scenes/terraced_houses.blend)" -eq 3044256
          test "$(git hash-object benchmarks/scenes/terraced_houses.blend)" = "01b31b0220847154f8923bf1303e9af3276df458"
          sha256sum benchmarks/scenes/terraced_houses.blend
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/emrelab/blender-projects/36c46d3b49ea872f6039e07a5e4769b5f9443654/LICENSE \
            -o benchmarks/scenes/terraced_houses_LICENSE.txt
          grep -q "Copyright (c) 2026 Yunus Emre Karaman" benchmarks/scenes/terraced_houses_LICENSE.txt
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-5.0.1-linux-x64
          key: official-blender-5.0.1-linux-x64-v2
      - if: steps.blender-cache.outputs.cache-hit != 'true'
        name: Download Blender 5.0.1
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
      - name: Validate Blender 5 Cycles camera, assets, and 4 spp smoke
        run: |
          ./blender-5.0.1-linux-x64/blender --factory-startup --disable-autoexec \
            -b benchmarks/scenes/terraced_houses.blend --python-exit-code 1 \
            --python scripts/audit_public_scene.py
      - name: Prepare deterministic public provenance
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          b=Path("benchmarks/scenes/terraced_houses.blend")
          a=json.loads(Path("/tmp/acd_terraced_audit.json").read_text())
          a.update({
            "source_url":"https://github.com/emrelab/blender-projects/blob/36c46d3b49ea872f6039e07a5e4769b5f9443654/terraced-houses/terraced-house.blend",
            "upstream_commit":"36c46d3b49ea872f6039e07a5e4769b5f9443654",
            "upstream_git_blob_sha1":"01b31b0220847154f8923bf1303e9af3276df458",
            "license":"MIT","author":"Yunus Emre Karaman",
            "size_bytes":b.stat().st_size,
            "sha256":hashlib.sha256(b.read_bytes()).hexdigest(),
            "use":"withheld generalization scene; no ACD algorithm optimization based on this fixture"
          })
          Path("benchmarks/scenes/terraced_houses.audit.json").write_text(json.dumps(a,indent=2)+"\n")
          print("ACD_E0022_HELDOUT_SCENE",json.dumps(a,indent=2))
          PY
      - name: Publish only verified scene, license, metadata, trace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f benchmarks/scenes/terraced_houses.blend
          git add benchmarks/scenes/terraced_houses_LICENSE.txt benchmarks/scenes/terraced_houses.audit.json
          {
            echo
            echo "## E0022 — Held-out nighttime architecture source incorporated (2026-11-12)"
            echo "- Terraced Houses, Yunus Emre Karaman, MIT source pinned upstream commit 36c46d3; source 3,044,256 B and SHA256 in benchmarks/scenes/terraced_houses.audit.json. Renderer Blender5.0.1 Cycles 192px 4spp passed. Original source unmodified."
            echo "- Scene assigned held-out generalization benchmark: do not tune denoiser against it. No quality comparison performed by this smoke. The user's project remains unpublished."
          } >> STATUS.md
          {
            echo
            echo "> **E0022 held-out scene validated and imported:** MIT Terraced Houses of Yunus Emre Karaman, 3MB, authored .blend+license SHA pinned; Blender5 Cycles smoke passed; next evaluate native baseline vs ACD without optimizing on held-out data."
          } >> docs/ROADMAP.md
          {
            echo
            echo "## 2026-11-12 — E0022, held-out MIT night scene verified and copied from immutable source"
            echo "- Upstream repo emrelab/blender-projects commit 36c46d3, MIT explicitly covers .blend scene according to its README and LICENSE. Filename, size, Git blob SHA1 and postdownload SHA256 recorded; source unmodified."
            echo "- 192px Cycles 4spp smoke passed under --disable-autoexec before commit. Add original license and attribution. Source author notes tutorial-based modelling with unknown tutorial credits: retain this provenance; no implication of endorsement."
            echo "- Assign as a held-out scene, distinct from Cozy Kitchen development; no denoiser training or parameter tuning against it."
          } >> docs/DECISION_LOG.md
          git add STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "testdata(E0022): import MIT held-out night exterior after Cycles validation"
          git push origin "HEAD:dev/acd-v2-oidn-detail-eval"
      - name: Archive verification logs only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acd-e0022-terraced-verification
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/acd_terraced_audit.json
            /tmp/acd_terraced_smoke.png
