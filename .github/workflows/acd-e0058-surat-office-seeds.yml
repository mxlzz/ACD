name: ACD E0058 Surat Office camera raw sampling variation only

on:
  push:
    branches: [dev/acd-v2-oidn-detail-eval]
    paths:
      - .github/workflows/acd-e0058-surat-office-seeds.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  independent-raw-seed-screen:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      OMP_NUM_THREADS: "4"
      ACD_PROBE_SCENE: external
      ACD_PROBE_DIR: /tmp/e0058
      ACD_PROBE_CAMERA: "CAM Office"
      ACD_PROBE_PATTERN: TABULATED_SOBOL
      ACD_PROBE_OFFSET: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Numeric, source checksum and camera-contract tests
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pytest -q tests/test_surat_seed_e0058.py tests/test_classroom_seed_e0056.py
      - name: Fetch exact E0057-verified source, never copy original to repository
        run: |
          mkdir -p /tmp/e0058-source
          gh release download v1.0.1 -R gitfalconhub/surat-diamond-bourse-gujarat-india -p surat-diamond-bourse-model-v1.0.1.zip -D /tmp
          test "$(stat -c%s /tmp/surat-diamond-bourse-model-v1.0.1.zip)" -eq 166627773
          echo "721e77b401fba0fa5c3b9df13b09279c6d05781af865f2b63945e7e032e991a8  /tmp/surat-diamond-bourse-model-v1.0.1.zip" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root=Path("/tmp/e0058-source")
          with ZipFile("/tmp/surat-diamond-bourse-model-v1.0.1.zip") as z:
              for item in z.infolist():
                  path=Path(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise RuntimeError("ZIP path escape")
              z.extractall(root)
          scenes=[p for p in root.rglob("Surat Diamond Bourse.blend") if p.is_file()]
          if len(scenes)!=1:raise RuntimeError("Expected exact one source BLEND")
          Path("/tmp/e0058-source-path").write_text(str(scenes[0]))
          PY
      - uses: actions/cache@v4
        id: blender
        with:
          path: blender-5.2.4-linux-x64
          key: acd-verified-blender-5.2.4-linux-x64-a1
      - name: Fetch official Blender if cache missing
        if: steps.blender.outputs.cache-hit != 'true'
        run: |
          B=blender-5.2.4-linux-x64.tar.xz
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 https://download.blender.org/release/Blender5.2/$B -o "$B"
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 https://download.blender.org/release/Blender5.2/blender-5.2.4.sha256 -o official.sha256
          grep -F "$B" official.sha256 | sha256sum -c -
          tar -xf "$B"
      - name: Blender headless runtime
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libgl1-mesa-dri libopengl0 libxkbcommon0
      - name: Read-only 96x54 16spp Office raw render from separate process seed539
        env:
          ACD_PROBE_SEED: "539"
          ACD_PROBE_LABEL: surat_seed539
        run: |
          ./blender-5.2.4-linux-x64/blender --disable-autoexec -b "$(cat /tmp/e0058-source-path)" --python-exit-code 1 --python tests/blender_seed_probe.py
      - name: Read-only same configuration raw render seed911
        env:
          ACD_PROBE_SEED: "911"
          ACD_PROBE_LABEL: surat_seed911
        run: |
          ./blender-5.2.4-linux-x64/blender --disable-autoexec -b "$(cat /tmp/e0058-source-path)" --python-exit-code 1 --python tests/blender_seed_probe.py
      - name: Validate source and quantitative seed variation, no denoiser benchmark
        run: |
          python -m scripts.analyze_surat_seed_e0058 --directory /tmp/e0058 --source-zip /tmp/surat-diamond-bourse-model-v1.0.1.zip --output /tmp/e0058-results
      - name: Permanently archive only metadata, numbers and negative findings
        run: |
          cp /tmp/e0058-results/E0058.md docs/experiments/E0058.md
          cp /tmp/e0058-results/E0058_RESULTS.json docs/experiments/E0058_RESULTS.json
          python - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path("docs/experiments/E0058_RESULTS.json").read_text())
          d=report["raw_seed_variation"]
          msg=("E0058 Surat CAM Office, 96x54 16spp 539/911 same configuration, "
               "relative RMSE "+str(d["relative_rmse"])+", changed "
               +str(d["changed_pixels_above_1e_minus_6"])+"/5184, "
               "measurable="+str(d["measurably_distinct"])
               +". No denoiser or converged reference. Architectural rights unresolved. "
               "docs/experiments/E0058.md.")
          for f in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
              with Path(f).open("a",encoding="utf-8") as stream:
                  stream.write("\n## E0058 independent source interior camera noise gate\n\n"+msg+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/E0058.md docs/experiments/E0058_RESULTS.json
          git add STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "research(E0058): archive real interior raw-seed variation screen"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: No EXR or derived image in public artifacts
        if: always()
        run: |
          echo "Source scene and EXR were kept on ephemeral runner only."
