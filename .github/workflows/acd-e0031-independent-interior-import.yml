name: ACD E0031 validate independent MIT architectural interior (smoke only)

on:
  push:
    branches:
      - dev/acd-v2-oidn-detail-eval
    paths:
      - .github/workflows/acd-e0031-independent-interior-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-before-import:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACD_AUDIT_SOURCE: 'Jure Sorn, Living Room (2014), MIT; commit a36bac4d06bda48d0295652e654347b4542202fb'
      ACD_AUDIT_RENDER: /tmp/acd_e0031_smoke.png
      ACD_AUDIT_OUTPUT: /tmp/acd_e0031_audit.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify immutable MIT source (do not replace existing fixture)
        run: |
          test ! -e benchmarks/scenes/living_room.blend
          mkdir -p benchmarks/scenes
          SRC=a36bac4d06bda48d0295652e654347b4542202fb
          curl -fL --retry 3 --connect-timeout 30 \
            "https://raw.githubusercontent.com/gto76/living-room/$SRC/living-room.blend" \
            -o benchmarks/scenes/living_room.blend
          test "$(stat -c%s benchmarks/scenes/living_room.blend)" -eq 7328212
          test "$(git hash-object benchmarks/scenes/living_room.blend)" = "51374a66c3745b6d67e1611056cda16f2c193e21"
          curl -fL --retry 3 --connect-timeout 30 \
            "https://raw.githubusercontent.com/gto76/living-room/$SRC/LICENSE" \
            -o benchmarks/scenes/living_room_LICENSE.txt
          grep -Fq "Copyright (c) 2014 Jure Sorn" benchmarks/scenes/living_room_LICENSE.txt
          grep -Fq "The MIT License" benchmarks/scenes/living_room_LICENSE.txt
          sha256sum benchmarks/scenes/living_room.blend
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-5.0.1-linux-x64
          key: official-blender-5.0.1-linux-x64-v2
      - if: steps.blender-cache.outputs.cache-hit != 'true'
        name: Fetch official Blender 5.0.1 runtime
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
      - name: Validate renderability and missing resources without modifying source
        run: |
          ./blender-5.0.1-linux-x64/blender --factory-startup --disable-autoexec \
            -b benchmarks/scenes/living_room.blend --python-exit-code 1 \
            --python scripts/audit_public_scene.py
      - name: Record provenance of validated scene
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("benchmarks/scenes/living_room.blend")
          data=json.loads(Path("/tmp/acd_e0031_audit.json").read_text())
          data.update({
            "source_url":"https://github.com/gto76/living-room/blob/a36bac4d06bda48d0295652e654347b4542202fb/living-room.blend",
            "upstream_commit":"a36bac4d06bda48d0295652e654347b4542202fb",
            "upstream_git_blob_sha1":"51374a66c3745b6d67e1611056cda16f2c193e21",
            "author":"Jure Sorn", "license":"MIT",
            "size_bytes":p.stat().st_size,
            "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "experimental_role":"Independent-author interior; not scored yet; no ACD tuning"
          })
          Path("benchmarks/scenes/living_room.audit.json").write_text(json.dumps(data,indent=2)+"\n")
          print("ACD_E0031_IMPORT", json.dumps(data,sort_keys=True))
          PY
      - name: Publish original MIT source only if checks passed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f benchmarks/scenes/living_room.blend
          git add benchmarks/scenes/living_room_LICENSE.txt benchmarks/scenes/living_room.audit.json
          {
            echo
            echo "## E0031 — Jure Sorn independent-author interior imported after Blender5 smoke"
            echo "- Immutable MIT source a36bac4; SHA256 and smoke metadata in benchmarks/scenes/living_room.audit.json. Blender 5.0.1 192px 4spp functional render passed. **No denoising quality result or change to addon.**"
          } >> STATUS.md
          {
            echo
            echo "> E0031 import complete: Living Room MIT © Jure Sorn (2014), Blender5 smoke verified; quality benchmark remains held out and manual. See docs/experiments/E0031.md."
          } >> docs/ROADMAP.md
          {
            echo
            echo "## E0031 imported — original interior source passed immutable verification"
            echo "- Source .blend unchanged, upstream Git blob and bytes checked, original MIT license preserved, Blender5 camera/assets/render smoke passed. Add only verified data and manifest; do not rank denoisers at 4spp."
          } >> docs/DECISION_LOG.md
          git add STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "testdata(E0031): import independent MIT interior after Blender5 smoke"
          git push origin "HEAD:dev/acd-v2-oidn-detail-eval"
      - name: Preserve smoke audit (including failed attempts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0031-independent-interior-smoke
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/acd_e0031_audit.json
            /tmp/acd_e0031_smoke.png
