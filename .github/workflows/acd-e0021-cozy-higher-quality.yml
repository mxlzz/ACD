name: ACD E0021 Cozy Kitchen higher-resolution reference convergence

on:
  push:
    branches:
      - dev/acd-v2-oidn-detail-eval
    paths:
      - .github/workflows/acd-e0021-cozy-higher-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-higher-detail:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify testdata, runner, and metric protocol
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pytest -q tests/test_runner.py tests/test_public_reference_fixture.py tests/test_e0020_summary.py
          echo "5f27c41cf828ca15ffd06fc3ad3d971343f6af4a29828c834252229a26dce395  benchmarks/scenes/cozy_kitchen.blend" | sha256sum -c -
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-5.0.1-linux-x64
          key: official-blender-5.0.1-linux-x64-v2
      - if: steps.blender-cache.outputs.cache-hit != 'true'
        name: Get official Blender 5.0.1
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
      - name: Cycles same EXR denoisers, 1024 spp x2 references, preserved aspect
        run: |
          python scripts/run_scene_benchmark.py \
            --blender ./blender-5.0.1-linux-x64/blender \
            --blend benchmarks/scenes/cozy_kitchen.blend \
            --output /tmp/acd_cozy_e0021 \
            --scene-name Main --max-width 512 \
            --samples 24 --reference-samples 1024 \
            --seed 539 --extra-seeds 911,1337 --reference-seed 8819 \
            --second-reference --device CPU \
            --methods STANDARD,HIGH,SUPER,NATIVE_COMP_OIDN
      - name: Print metrics and quality-control checks
        run: |
          python -m scripts.summarize_e0020 \
            --directory /tmp/acd_cozy_e0021 --experiment E0021 \
            --output /tmp/acd_cozy_e0021/E0021_GENERATED.md
      - name: Archive numbers (14 days); persist to docs after review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0021-cozy-metrics
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/acd_cozy_e0021/metadata.json
            /tmp/acd_cozy_e0021/metrics.json
            /tmp/acd_cozy_e0021/seed_aggregate.json
            /tmp/acd_cozy_e0021/region_metrics.json
            /tmp/acd_cozy_e0021/E0021_GENERATED.md
            /tmp/acd_cozy_e0021/seed_*/metrics.json
      - name: Archive EXR source and outputs (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0021-cozy-exr
          retention-days: 7
          if-no-files-found: warn
          compression-level: 1
          path: |
            /tmp/acd_cozy_e0021/*.exr
            /tmp/acd_cozy_e0021/seed_*/*.exr
