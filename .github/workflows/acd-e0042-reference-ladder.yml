name: ACD E0042 640px Italian Flat finite-reference ladder and visual gallery

on:
  push:
    branches:
      - dev/acd-v2-oidn-detail-eval
    paths:
      - .github/workflows/acd-e0042-reference-ladder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  two-seed-reference-trajectory:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ACD_E0042_ROOT: /tmp/acd-e0042
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lab with OpenEXR, Pillow and reference checks
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pip install "Pillow>=10,<13"
          python -m pytest -q tests/test_italian_ladder_e0042.py tests/test_italian_ladder_e0041.py tests/test_reference_audit.py
      - name: Download unchanged Italian Flat source after SHA256 provenance check
        run: |
          mkdir -p /tmp/e0042-source
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            https://download.blender.org/demo/cycles/flat-archiviz.blend \
            -o /tmp/e0042-source/flat-archiviz.blend
          echo "0027fcbd73411cce7f49b3d86c22c03d18980e22641083da9d8ba82d9fc94e25  /tmp/e0042-source/flat-archiviz.blend" | sha256sum -c -
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-5.2.4-linux-x64
          key: acd-verified-blender-5.2.4-linux-x64-a1
      - name: Download official Blender 5.2.4 LTS with SHA256 on cache miss
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          F=blender-5.2.4-linux-x64.tar.xz
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 \
            https://download.blender.org/release/Blender5.2/$F -o "$F"
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 \
            https://download.blender.org/release/Blender5.2/blender-5.2.4.sha256 -o official.sha256
          grep -F "$F" official.sha256 | sha256sum -c -
          tar -xf "$F"
      - name: Prepare headless EGL libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1-mesa-dri libopengl0 libxkbcommon0
      - name: Render 640x400 at 32/64/128spp with two independent seeds
        run: |
          ./blender-5.2.4-linux-x64/blender --factory-startup --disable-autoexec \
            -b /tmp/e0042-source/flat-archiviz.blend \
            --python-exit-code 1 --python scripts/blender_italian_ladder_e0042.py
      - name: Measure interseed spread and create six-image 1:1 gallery
        run: |
          python -m scripts.analyze_italian_ladder_e0042 \
            --directory "$ACD_E0042_ROOT" --output /tmp/acd-e0042-report
      - name: Archive scientific limits, metadata and viewable gallery permanently
        run: |
          cp /tmp/acd-e0042-report/e0042_results.json docs/experiments/E0042_RESULTS.json
          mkdir -p benchmarks/results/italian_flat_e0042
          cp /tmp/acd-e0042-report/gallery/italian_reference_ladder.png benchmarks/results/italian_flat_e0042/
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/experiments/E0042_RESULTS.json").read_text())
          lines=[
            "# E0042 — Italian Flat, finite reference spread at 640x400",
            "", "Six Cycles CPU scene-linear renders, no denoising, Blender 5.2.4 LTS; camera Cam Kitchen Table. Original .blend not published.",
            "Two seeds 8819 and 8922 at 32, 64 and 128 spp each. Source CC-BY © Flavio Della Tommasa.",
            "", "![Reference pair ladder, same diagnostic tone map](italian_reference_ladder.png)",
            "", "| Samples | Interseed RMSE |",
            "|---|---:|"
          ]
          for spp in ("32","64","128"):
            p=d["reference_pairs"][spp]
            lines.append(f'| {spp} | {p["interseed_metrics"]["rmse_linear"]:.8f} |')
          lines += [
            "", "Combined actual rendering+write wall seconds: "+str(round(d["cpu_total_wall_seconds"],1))+
            ". Peak process RSS (Linux KB): "+str(d["peak_process_rss_kb"])+".",
            "This comparison evaluates remaining Monte Carlo sample noise, NOT denoising quality. Two finite references are not converged ground truth and may have correlated random streams. Preview transfer not Blender OCIO/AgX.",
            "Analysis JSON: [E0042_RESULTS.json](../../../docs/experiments/E0042_RESULTS.json)."
          ]
          Path("benchmarks/results/italian_flat_e0042/README.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          Path("docs/experiments/E0042.md").write_text("\n".join(lines).replace("italian_reference_ladder.png","../../benchmarks/results/italian_flat_e0042/italian_reference_ladder.png")+"\n",encoding="utf-8")
          note="\n## E0042 Italian Flat 640px reference comparison (2026-11-13)\n\n"+"\n".join(lines[2:])+"\n"
          for path in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
            with Path(path).open("a",encoding="utf-8") as f:f.write(note)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/E0042.md docs/experiments/E0042_RESULTS.json
          git add benchmarks/results/italian_flat_e0042/ STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "research(E0042): archive Italian Flat 640px finite reference spread and diagnostic gallery"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: Retain EXRs temporarily for reference validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0042-italian-640-exr
          retention-days: 14
          compression-level: 1
          if-no-files-found: warn
          path: /tmp/acd-e0042/
