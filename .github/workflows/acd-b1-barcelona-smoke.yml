name: ACD B1 independently authored architectural Barcelona Pavilion smoke only

on:
  push:
    branches:
      - dev/acd-v2-oidn-detail-eval
    paths:
      - .github/workflows/acd-b1-barcelona-smoke.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-source-without-publishing:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACD_AUDIT_SOURCE: "Barcelona Pavilion, eMirage, Blender official demo, CC-BY (version unspecified)"
      ACD_AUDIT_RENDER: /tmp/acd_b1_barcelona_smoke.png
      ACD_AUDIT_OUTPUT: /tmp/acd_b1_barcelona_audit.json
      ACD_AUDIT_RELINK_ROOT: /tmp/acd-b1-source/unpacked
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download Blender official demonstration archive (no Git binary upload)
        run: |
          mkdir -p /tmp/acd-b1-source
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            https://download.blender.org/demo/test/pabellon_barcelona_v1.scene_.zip \
            -o /tmp/acd-b1-source/barcelona.zip
          python - <<'PY'
          import hashlib,json
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          root=Path("/tmp/acd-b1-source")
          src=root/"barcelona.zip"
          with ZipFile(src) as z:
              members=z.infolist()
              print("B1_ARCHIVE_CONTENTS", json.dumps([x.filename for x in members]))
              if len(members)>5000:
                  raise ValueError("Too many archive entries")
              total=sum(x.file_size for x in members)
              if total > 1_200_000_000:
                  raise ValueError("Archive uncompressed beyond 1.2GB safety cap")
              for info in members:
                  path=PurePosixPath(info.filename.replace("\\","/"))
                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError("Unsafe archive path "+info.filename)
                  if ((info.external_attr >> 16) & 0o170000)==0o120000:
                      raise ValueError("External symlink forbidden")
              z.extractall(root/"unpacked")
          actual_hash=hashlib.sha256(src.read_bytes()).hexdigest()
          if actual_hash != "0a85bf512329f1780563069512b934d679a6c543eeb1a4ec4f60cddeab706697":
              raise ValueError("Official Blender demo ZIP bytes changed; stop and review")
          blends=list((root/"unpacked").rglob("*.blend"))
          if len(blends)!=1:
              raise ValueError("Expect exactly one .blend, found "+str([str(x) for x in blends]))
          blend=blends[0]
          if hashlib.sha256(blend.read_bytes()).hexdigest() != "92162db8cabcd03641c53df95554b604b494ba74a76a099c7e06637e9379120a":
              raise ValueError("Blender source binary changed")
          (root/"blend_path.txt").write_text(str(blend))
          data={"source_url":"https://download.blender.org/demo/test/pabellon_barcelona_v1.scene_.zip",
                "author":"eMirage","license_catalog":"CC-BY, version unspecified",
                "archive_sha256":hashlib.sha256(src.read_bytes()).hexdigest(),
                "archive_bytes":src.stat().st_size,
                "archive_entries":len(members),
                "archive_paths":[x.filename for x in members],
                "uncompressed_bytes":total,
                "blend_file_relative":str(blend.relative_to(root/"unpacked")),
                "blend_size_bytes":blend.stat().st_size,
                "blend_sha256":hashlib.sha256(blend.read_bytes()).hexdigest(),
                "license_files":[x.filename for x in members if "licen" in x.filename.lower() or "readme" in x.filename.lower()],
                "benchmark_quality_performed":False}
          (root/"source_manifest.json").write_text(json.dumps(data,indent=2)+"\n")
          print("ACD_B1_SOURCE_VERIFIED",json.dumps(data,sort_keys=True))
          PY
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-5.2.4-linux-x64
          key: acd-verified-blender-5.2.4-linux-x64-a1
      - name: Get official Blender with checksum if not cached
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          F=blender-5.2.4-linux-x64.tar.xz
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 \
            https://download.blender.org/release/Blender5.2/$F -o "$F"
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 \
            https://download.blender.org/release/Blender5.2/blender-5.2.4.sha256 -o official.sha256
          grep -F "$F" official.sha256 | sha256sum -c -
          tar -xf "$F"
      - name: Ensure required headless EGL runtime
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1-mesa-dri libopengl0 libxkbcommon0
      - name: Open scene without automatic code and verify 4spp Cycles CPU
        run: |
          BLEND="$(cat /tmp/acd-b1-source/blend_path.txt)"
          ./blender-5.2.4-linux-x64/blender --factory-startup --disable-autoexec \
            -b "$BLEND" --python-exit-code 1 --python scripts/audit_public_scene.py
      - name: Permanently record successful source audit, no scene binary
        run: |
          mkdir -p docs/experiments
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path("/tmp/acd-b1-source/source_manifest.json").read_text())
          audit=json.loads(Path("/tmp/acd_b1_barcelona_audit.json").read_text())
          if not audit["smoke_render_success"] or audit["unbundled_missing_images"] or audit["external_blend_libraries"]:
              raise ValueError("Unusable scene")
          output={"experiment":"B1_BARCELONA_SMOKE","source":source,"audit":audit,
                  "quality_ranking":False,"source_binary_republished":False,
                  "next_gate":"Freeze SHA for repeatable 512px pilot and check reference convergence/time"}
          Path("docs/experiments/B1_BARCELONA_AUDIT.json").write_text(json.dumps(output,indent=2)+"\n")
          lines=["# B1 Barcelona Pavilion — Blender 5.2.4 functional audit",
                 "", "[Preinscripción](B1_CORPUS_PLAN.md). eMirage / official Blender demo, CC-BY (version unspecified), source ZIP NOT redistributed.",
                 "", "Archive SHA256: "+source["archive_sha256"],
                 "BLEND SHA256: "+source["blend_sha256"],
                 "Scene: "+audit["scene"]+"; camera: "+audit["active_camera"],
                 "Objects: "+str(audit["objects"])+"; meshes: "+str(audit["meshes"])+"; materials: "+str(audit["materials"])+
                 "; missing textures: "+str(audit["unbundled_missing_images"])+
                 "; archive-only in-memory path resolutions: "+str(audit["asset_path_remaps"]),
                 "Cycles 192×192, CPU 4 spp smoke: passed (functional only, not quality).",
                 "", "Next: pin source SHA in download step; run time/reference-convergence pilot, no production-size benchmark yet."]
          Path("docs/experiments/B1_BARCELONA.md").write_text("\n\n".join(lines)+"\n")
          trace="\n## B1 Barcelona Pavilion functional smoke verified (2026-11-13)\n\n"+"\n".join(lines[2:])+"\n"
          for path in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
              with Path(path).open("a",encoding="utf-8") as f:f.write(trace)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/B1_BARCELONA_AUDIT.json docs/experiments/B1_BARCELONA.md
          git add STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "testdata(B1): audit official eMirage Barcelona Pavilion without publishing blend"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: Preserve functional preview and manifest only, no original ZIP or BLEND
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-b1-barcelona-smoke
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/acd_b1_barcelona_smoke.png
            /tmp/acd_b1_barcelona_audit.json
            /tmp/acd-b1-source/source_manifest.json
