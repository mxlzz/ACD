name: ACD E0039 test compositor socket guides vs EXR denoising AOV

on:
  push:
    branches:
      - dev/acd-v2-oidn-detail-eval
    paths:
      - .github/workflows/acd-e0039-compositor-aov.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-guide-identity:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACD_BENCH_DIR: /tmp/acd-e0039
      ACD_SCENE: detail_target
      ACD_DEVICE: CPU
      ACD_WIDTH: "128"
      ACD_HEIGHT: "96"
      ACD_INPUT_SPP: "16"
      ACD_INPUT_SEED: "539"
      ACD_REFERENCE_SPP: "64"
      ACD_REFERENCE_SEED: "8819"
      ACD_EXTRA_SEEDS: ""
      ACD_DOUBLE_REFERENCE: "0"
      ACD_METHODS: "STANDARD,HIGH,SUPER,NATIVE_COMP_OIDN"
      ACD_CAPTURE_AOV: "1"
      ACD_E0039_CAPTURE_SOCKETS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tests and EXR
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pytest -q tests/test_compositor_guides_e0039.py tests/test_blender_compat_e0035.py
      - name: Download official Blender 5.2.4 with published SHA
        run: |
          F=blender-5.2.4-linux-x64.tar.xz
          curl -fL --retry 3 https://download.blender.org/release/Blender5.2/$F -o "$F"
          curl -fL --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.4.sha256 -o official.sha256
          grep -F "$F" official.sha256 | sha256sum -c -
          tar -xf "$F"
      - name: Install headless graphics prerequisites
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1-mesa-dri libopengl0 libxkbcommon0
      - name: Render once, export actual compositor Raw/Albedo/Normal sockets
        run: |
          ./blender-5.2.4-linux-x64/blender -b --factory-startup \
            --python-exit-code 1 --python tests/blender_compare_smoke.py
      - name: Confirm socket data versus saved multilayer denoising passes
        run: |
          python -m scripts.analyze_compositor_guides_e0039 --directory "$ACD_BENCH_DIR" --output "$ACD_BENCH_DIR/e0039_results.json"
      - name: Archive exact results and interpretation
        run: |
          cp "$ACD_BENCH_DIR/e0039_results.json" docs/experiments/E0039_RESULTS.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/experiments/E0039_RESULTS.json").read_text())
          lines=["# E0039 — Comparar sockets RLayers con EXR multilayer",
                 "", "Blender 5.2.4 LTS, 128×96, 16 spp, una ejecución Cycles. Exports de sockets del compositor y AOV de mismo render. No ranking de calidad.",
                 "", "| Señal | RMSE socket vs AOV | Max absoluto |",
                 "|---|---:|---:|"]
          for k in ("NoisyImage","Albedo","Normal"):
            v=d["passes"][k]
            lines.append(f'| {k} | {v["aov_vs_socket"]["rmse_linear"]:.9f} | {v["max_abs"]:.9f} |')
          lines += ["", "Si las guías no coinciden, el EXR archivado no reproduce exactamente los inputs del nodo. Si coinciden, revisar otros estados de filtro/buffer/versiones. Sin ground truth convergente.",
                    "[JSON completo](E0039_RESULTS.json)."]
          Path("docs/experiments/E0039.md").write_text("\n".join(lines)+"\n")
          note="\n## E0039 socket/AOV contract result (2026-11-13)\n\n"+"\n".join(lines[2:])+"\n"
          for path in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
            with Path(path).open("a",encoding="utf-8") as f:f.write(note)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/E0039.md docs/experiments/E0039_RESULTS.json
          git add STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "research(E0039): archive actual Blender compositor socket vs EXR guide identity"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: Retain actual noisy beauty/guide socket EXR temporarily
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0039-renders-and-guide-sockets
          retention-days: 14
          if-no-files-found: warn
          compression-level: 1
          path: /tmp/acd-e0039/
