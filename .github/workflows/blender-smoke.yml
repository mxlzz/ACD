name: Blender 5 headless smoke

on:
  pull_request:
    paths:
      - "addon/**"
      - "tests/blender_smoke.py"
      - "tests/blender_export_smoke.py"
      - "acd_lab/exr.py"
      - ".github/workflows/blender-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["5.0.1", "5.3.0"]
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      BLENDER_VERSION: ${{ matrix.version }}
      ACD_SKIP_RENDER: ${{ matrix.version == '5.3.0' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache official Blender binary
        id: cache
        uses: actions/cache@v4
        with:
          path: blender-${{ matrix.version }}-linux-x64
          key: official-blender-${{ matrix.version }}-linux-x64-v2
      - name: Download official Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          RELEASE_FOLDER="Blender"$(echo "$BLENDER_VERSION" | cut -d. -f1,2)
          curl -fL --retry 3 --connect-timeout 30 \
            "https://download.blender.org/release/$RELEASE_FOLDER/blender-$BLENDER_VERSION-linux-x64.tar.xz" \
            -o blender.tar.xz
          tar -xf blender.tar.xz
      - name: Blender version
        run: "./blender-$BLENDER_VERSION-linux-x64/blender --version"
      - name: Test Cycles compositor and CPU render
        run: "./blender-$BLENDER_VERSION-linux-x64/blender -b --factory-startup -noaudio --python-exit-code 1 --python tests/blender_smoke.py"
      - name: Generate actual raw multilayer Cycles EXR
        if: matrix.version == '5.0.1'
        env:
          ACD_TEST_EXR: ${{ runner.temp }}/acd_raw_smoke.exr
        run: |
          ./blender-$BLENDER_VERSION-linux-x64/blender -b --factory-startup -noaudio --python-exit-code 1 --python tests/blender_export_smoke.py
      - name: Validate Blender EXR metadata and AOV mapping
        if: matrix.version == '5.0.1'
        env:
          ACD_TEST_EXR: ${{ runner.temp }}/acd_raw_smoke.exr
        run: |
          python -m pip install -e ".[exr]"
          python -m acd_lab.cli inspect-exr --input "$ACD_TEST_EXR"
          python -m acd_lab.cli check-passes --input "$ACD_TEST_EXR" --output "${{ runner.temp }}/acd_raw_check.json"
      - name: Generate RAW / Standard / High / Super from one Cycles render
        if: matrix.version == '5.0.1'
        env:
          ACD_BENCH_DIR: ${{ runner.temp }}/acd_compare
        run: |
          ./blender-$BLENDER_VERSION-linux-x64/blender -b --factory-startup -noaudio --python-exit-code 1 --python tests/blender_compare_smoke.py
      - name: Compare all denoisers against independent reference
        if: matrix.version == '5.0.1'
        env:
          ACD_BENCH_DIR: ${{ runner.temp }}/acd_compare
        run: |
          python -m acd_lab.cli compare-batch --directory "$ACD_BENCH_DIR" --output "$ACD_BENCH_DIR/metrics.json"
      - name: Upload paired comparison EXRs
        if: matrix.version == '5.0.1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cycles-5.0.1-same-input-comparison
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/acd_compare/
      - name: Architectural interior controlled comparison
        if: matrix.version == '5.0.1' && github.event_name == 'workflow_dispatch'
        env:
          ACD_SCENE: interior
          ACD_WIDTH: "96"
          ACD_HEIGHT: "80"
          ACD_INPUT_SPP: "32"
          ACD_EXTRA_SEEDS: "911,1337,2026"
          ACD_REFERENCE_SPP: "4096"
          ACD_DOUBLE_REFERENCE: "1"
          ACD_BENCH_DIR: ${{ runner.temp }}/acd_interior
        run: |
          ./blender-$BLENDER_VERSION-linux-x64/blender -b --factory-startup -noaudio --python-exit-code 1 --python tests/blender_compare_smoke.py
          python -m acd_lab.cli compare-batch --directory "$ACD_BENCH_DIR" --output "$ACD_BENCH_DIR/metrics.json"
          for seed_dir in "$ACD_BENCH_DIR"/seed_*; do
            if [ -d "$seed_dir" ]; then
              python -m acd_lab.cli compare-batch --directory "$seed_dir" --output "$seed_dir/metrics.json"
            fi
          done
          python -m acd_lab.cli aggregate-seeds --directory "$ACD_BENCH_DIR" --output "$ACD_BENCH_DIR/seed_aggregate.json"
      - name: Upload architectural interior experiment
        if: matrix.version == '5.0.1' && github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cycles-5.0.1-mini-interior
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/acd_interior/
      - name: Save and benchmark an actual .blend input without modifying it
        if: matrix.version == '5.0.1'
        env:
          ACD_FIXTURE_BLEND: ${{ runner.temp }}/external_fixture.blend
          ACD_BENCH_DIR: ${{ runner.temp }}/external_bench
          ACD_SCENE: external
          ACD_INPUT_SPP: "4"
          ACD_REFERENCE_SPP: "32"
          ACD_METHODS: "STANDARD,HIGH,SUPER"
          ACD_CAPTURE_AOV: "1"
          ACD_EXTRA_SEEDS: ""
        run: |
          ./blender-$BLENDER_VERSION-linux-x64/blender -b --factory-startup -noaudio --python-exit-code 1 --python tests/blender_save_external_fixture.py
          sha256sum "$ACD_FIXTURE_BLEND" > "${{ runner.temp }}/source.sha256"
          ./blender-$BLENDER_VERSION-linux-x64/blender -b "$ACD_FIXTURE_BLEND" -noaudio --python-exit-code 1 --python tests/blender_compare_smoke.py
          cd "${{ runner.temp }}"
          sha256sum --check source.sha256
          cd "$GITHUB_WORKSPACE"
          test -f "$ACD_BENCH_DIR/raw_multilayer.exr"
          python -m acd_lab.cli inspect-exr --input "$ACD_BENCH_DIR/raw_multilayer.exr"
          python -m acd_lab.cli compare-batch --directory "$ACD_BENCH_DIR" --output "$ACD_BENCH_DIR/metrics.json"
          python -m acd_lab.cli compare-regions --directory "$ACD_BENCH_DIR" --passes "$ACD_BENCH_DIR/raw_multilayer.exr" --output "$ACD_BENCH_DIR/region_metrics.json" --error-maps "$ACD_BENCH_DIR/error_maps.npz"
      - name: Upload external-.blend integration fixture results
        if: matrix.version == '5.0.1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-5.0.1-external-scene-test
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/external_bench/
      - name: Upload raw EXR and diagnostic report
        if: matrix.version == '5.0.1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cycles-5.0.1-exr-smoke
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/acd_raw_smoke.exr
            ${{ runner.temp }}/acd_raw_smoke.json
            ${{ runner.temp }}/acd_raw_check.json

