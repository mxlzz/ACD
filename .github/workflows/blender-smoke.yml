name: Blender 5 headless smoke

on:
  push:
    branches: ["dev/**"]
    paths:
      - "addon/**"
      - "tests/blender_smoke.py"
      - ".github/workflows/blender-smoke.yml"
  pull_request:
    paths:
      - "addon/**"
      - "tests/blender_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLENDER_VERSION: "5.0.1"
    steps:
      - uses: actions/checkout@v4
      - name: Cache official Blender binary
        id: cache
        uses: actions/cache@v4
        with:
          path: blender-5.0.1-linux-x64
          key: official-blender-5.0.1-linux-x64-v1
      - name: Download official Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz" \
            -o blender.tar.xz
          tar -xf blender.tar.xz
      - name: Blender version
        run: ./blender-5.0.1-linux-x64/blender --version
      - name: Test Cycles compositor construction and small CPU render
        run: ./blender-5.0.1-linux-x64/blender -b --factory-startup -noaudio --python tests/blender_smoke.py
