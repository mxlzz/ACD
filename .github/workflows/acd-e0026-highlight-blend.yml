name: ACD E0026 raw-only bright HDR blending controls on previous EXRs

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  offline-ablations-no-rerender:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup EXR and validate that inference needs only Raw/OIDN
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pytest -q tests/test_highlight_blend.py tests/test_hdr_tail.py
      - name: Restore exact Cozy E0021 and Terraced E0023 EXRs; NO rerender
        run: |
          mkdir -p /tmp/cozy-e0026 /tmp/terraced-e0026
          gh run download 43289852695 -R mxlzz/ACD -n acd-e0021-cozy-exr -D /tmp/cozy-e0026
          gh run download 43289852695 -R mxlzz/ACD -n acd-e0021-cozy-metrics -D /tmp/cozy-e0026
          gh run download 43291659387 -R mxlzz/ACD -n acd-e0023-terraced-exr -D /tmp/terraced-e0026
          gh run download 43291659387 -R mxlzz/ACD -n acd-e0023-terraced-metrics -D /tmp/terraced-e0026
          test -f /tmp/cozy-e0026/seed_1337/acd_compare_Raw.exr
          test -f /tmp/terraced-e0026/seed_911/acd_compare_NATIVE_COMP_OIDN.exr
      - name: Evaluate prespecified methods with BOTH references / 3 seeds / 2 scenes
        run: |
          python -m scripts.analyze_highlight_mix_e0026 --cozy /tmp/cozy-e0026 \
            --terraced /tmp/terraced-e0026 --output /tmp/e0026_results.json
      - name: Archive compact results without any copyrighted EXR payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0026-offline-hdr-mix
          retention-days: 14
          if-no-files-found: warn
          path: /tmp/e0026_results.json
