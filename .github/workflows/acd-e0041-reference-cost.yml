name: ACD E0041 Italian Flat finite reference spread and CPU budget calibration

on:
  push:
    branches:
      - dev/acd-v2-oidn-detail-eval
    paths:
      - .github/workflows/acd-e0041-reference-cost.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference-ladder-pilot:
    if: github.repository == 'mxlzz/ACD'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ACD_E0041_ROOT: /tmp/acd-e0041
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install basic laboratory and validate synthetic reference metrics
        run: |
          python -m pip install -e ".[dev,exr]"
          python -m pytest -q tests/test_italian_ladder_e0041.py tests/test_reference_audit.py
      - name: Fetch exact verified Italian Flat binary in temporary directory
        run: |
          mkdir -p /tmp/acd-e0041-source
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            https://download.blender.org/demo/cycles/flat-archiviz.blend \
            -o /tmp/acd-e0041-source/flat-archiviz.blend
          test "$(stat -c%s /tmp/acd-e0041-source/flat-archiviz.blend)" -eq 367972724
          echo "0027fcbd73411cce7f49b3d86c22c03d18980e22641083da9d8ba82d9fc94e25  /tmp/acd-e0041-source/flat-archiviz.blend" | sha256sum -c -
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: blender-5.2.4-linux-x64
          key: acd-verified-blender-5.2.4-linux-x64-a1
      - name: Download Blender 5.2.4 with official SHA256 when not cached
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          F=blender-5.2.4-linux-x64.tar.xz
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 \
            https://download.blender.org/release/Blender5.2/$F -o "$F"
          curl -fL --retry 4 --retry-all-errors --retry-delay 5 \
            https://download.blender.org/release/Blender5.2/blender-5.2.4.sha256 -o official.sha256
          grep -F "$F" official.sha256 | sha256sum -c -
          tar -xf "$F"
      - name: Install headless rendering libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1-mesa-dri libopengl0 libxkbcommon0
      - name: Render fixed two-seed 8/16/32spp ladder plus one 640px cost sample
        run: |
          ./blender-5.2.4-linux-x64/blender --factory-startup --disable-autoexec \
            -b /tmp/acd-e0041-source/flat-archiviz.blend \
            --python-exit-code 1 --python scripts/blender_italian_ladder_e0041.py
      - name: Analyze finite inter-seed spread and scaling, no quality ranking
        run: |
          python -m scripts.analyze_italian_ladder_e0041 \
            --directory "$ACD_E0041_ROOT" --output "$ACD_E0041_ROOT/e0041_results.json"
      - name: Archive numeric results, run times, and next gate decision
        run: |
          cp "$ACD_E0041_ROOT/e0041_results.json" docs/experiments/E0041_RESULTS.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("docs/experiments/E0041_RESULTS.json").read_text())
          sp=d["reference_interseed_by_spp"]
          render=d["render_manifest"]
          total=sum(x["render_and_write_wall_seconds"] for x in render)
          lines=["# E0041 — Italian Flat: convergencia exploratoria y tiempo de Cycles CPU",
                 "", "Fuente original eMirage no; **Italian Flat © Flavio Della Tommasa, CC-BY**, Blender oficial. Cámara elegida antes de medir: Cam Kitchen Table.",
                 "Blender 5.2.4 LTS. Cuatro pasos: 320×200, 8/16/32 spp, seeds8819 y 8922; y 640×400 8spp en seed8819.",
                 "", "| spp (320×200) | RMSE entre semillas |",
                 "|---|---:|"]
          for k in ("8","16","32"):
            lines.append(f'| {k} | {sp[k]["interseed_difference"]["rmse_linear"]:.8f} |')
          lines += ["",
              "Ratio de tiempos al cuadruplicar píxeles (640×400, 8spp vs 320×200, 8spp): "+str(round(d["resolution_time_ratio_640x400_vs_320x200_at_8spp"],3))+".",
              "Tiempo CPU total de los 7 renders (incluye escritura y costes de escena tras carga): "+str(round(total,1))+" segundos.",
              "No hay denoiser ni ground truth en esta prueba. Menor error entre semillas no garantiza referencia convergida; independencia estadística no acreditada. No extrapolar linealmente a 1080p sin otro piloto.",
              "", "[JSON completo](E0041_RESULTS.json)."]
          Path("docs/experiments/E0041.md").write_text("\n".join(lines)+"\n")
          note="\n## E0041 completed — Italian Flat CPU cost and finite-spp reference spread\n\n"+"\n".join(lines[2:])+"\n"
          for p in ("STATUS.md","docs/ROADMAP.md","docs/DECISION_LOG.md"):
            with Path(p).open("a",encoding="utf-8") as f:f.write(note)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/experiments/E0041_RESULTS.json docs/experiments/E0041.md
          git add STATUS.md docs/ROADMAP.md docs/DECISION_LOG.md
          git commit -m "research(E0041): archive Italian Flat finite reference spread and CPU cost"
          git push origin HEAD:dev/acd-v2-oidn-detail-eval
      - name: Retain EXRs and diagnostic manifest temporarily (never source blend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acd-e0041-italian-finite-reference-exr
          retention-days: 14
          if-no-files-found: warn
          compression-level: 1
          path: /tmp/acd-e0041/
